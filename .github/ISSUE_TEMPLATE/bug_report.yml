name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: dropdown
    id: version
    attributes:
      label: Which version?
      options:
        - Godot port
        - JS version (browser / desktop)
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Version number
      description: Shown on the title screen or in the name of the package you downloaded.
      placeholder: godot 0.1.0
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Start a run with the Pilgrim lantern
        2. ...
    validations:
      required: true
  - type: input
    id: seed
    attributes:
      label: Game seed
      description: Shown in the pause menu.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux, macOS, Other]
  - type: textarea
    id: log
    attributes:
      label: Error log and screenshots
      description: |
        Windows: `%APPDATA%\Last Lantern Godot\logs\godot.log`
        Linux: `~/.local/share/Last Lantern Godot/logs/godot.log`
        Drag screenshots here.
